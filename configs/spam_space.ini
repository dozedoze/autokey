; ============================================================
; 示例：单键连发（类似按键精灵「狂按某个键」）
; 把 Exe= 改成你的目标程序进程名
; ============================================================

[Macro]
Name=空格键连发
Loop=1
LoopDelay=0
Repeat=0

[Hotkeys]
Start=F6
Stop=F7
Pause=F8

[Target]
Exe=
Title=
Class=
Activate=1
SendMode=Send

[Sequence]
; 每 50ms 按一次空格
1={Space}|50
