; ============================================================
; 示例：编排一组按键顺序（技能宏 / 快捷操作）
; 把 Exe 改成目标程序，例如游戏或某工具
; ============================================================

[Macro]
Name=组合键序列演示
Loop=1
LoopDelay=1000
Repeat=5

[Hotkeys]
Start=F9
Stop=F10
Pause=F11

[Target]
; 改成你的程序，例如：chrome.exe / Code.exe / your_game.exe
Exe=
Title=
Class=
Activate=1
SendMode=Send

[Sequence]
; 1 号技能 -> 等 300ms -> 2 号 -> 等 500ms -> 大招 R
1=1|300
2=2|500
3=r|200
; 短暂等待
4=sleep|800
; Ctrl+S 保存类操作示例（按需删除）
; 5=^s|200
