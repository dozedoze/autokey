; ============================================================
; 示例：对记事本循环输入 "hello" + 回车
; 使用前请先打开记事本 (notepad.exe)
; 热键：F6 开始 / F7 停止 / F8 暂停
; ============================================================

[Macro]
Name=记事本 Hello 循环
; 1=循环，0=只跑一轮
Loop=1
; 每一轮序列跑完后的间隔（毫秒）
LoopDelay=500
; 循环次数，0=无限（仅 Loop=1 时有效）
Repeat=0

[Hotkeys]
Start=F6
Stop=F7
Pause=F8

[Target]
; 进程名（推荐），例如 notepad.exe / chrome.exe / Game.exe
Exe=notepad.exe
; 窗口标题包含匹配（可留空）
Title=
; 窗口类名（可留空）
Class=
; 开始前是否把目标窗口激活到前台
Activate=1
; Send=前台按键（最兼容）；ControlSend=尽量后台发到目标窗口（部分程序无效）
SendMode=Send

[Sequence]
; 格式：序号=按键|延迟毫秒
; 按键可用：a、{Enter}、{Space}、{F1}、{Tab}、^+s（Ctrl+Shift+S）等
; 也可：sleep|毫秒
;      click|屏幕X|屏幕Y|延迟毫秒
;      按键|延迟|按住毫秒
1=h|80
2=e|80
3=l|80
4=l|80
5=o|80
6={Enter}|200
