name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # AutoHotkey v2 的安装包不含 Ahk2Exe，编译器必须从自己的仓库单独取。
      - name: Fetch AutoHotkey v2 + Ahk2Exe (portable)
        shell: pwsh
        env:
          AHK_VERSION: 2.0.19
          AHK2EXE_TAG: Ahk2Exe1.1.37.02a2
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $tools = Join-Path $env:GITHUB_WORKSPACE "tools\ahk"
          New-Item -ItemType Directory -Force -Path "$tools\Compiler" | Out-Null

          $ahkZip = "$env:TEMP\AutoHotkey_$env:AHK_VERSION.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $ahkZip `
            -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip"
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $tools -Force

          $compZip = "$env:TEMP\$env:AHK2EXE_TAG.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $compZip `
            -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$env:AHK2EXE_TAG/$env:AHK2EXE_TAG.zip"
          Expand-Archive -LiteralPath $compZip -DestinationPath "$tools\Compiler" -Force

          $base = Get-ChildItem -Path $tools -Recurse -Filter AutoHotkey64.exe |
            Select-Object -First 1 -ExpandProperty FullName
          $comp = Get-ChildItem -Path $tools -Recurse -Filter Ahk2Exe.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $base) { throw "AutoHotkey64.exe not found in $tools" }
          if (-not $comp) { throw "Ahk2Exe.exe not found in $tools" }
          "AHK_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AHK2EXE=$comp" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Base=$base"
          Write-Host "Compiler=$comp"

      - name: Validate script syntax
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "src\AutoKey.ahk"
          & $env:AHK_BASE /ErrorStdOut /validate $src
          if ($LASTEXITCODE -ne 0) { throw "syntax check failed (exit $LASTEXITCODE)" }

      - name: Compile AutoKey.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\configs | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "src\AutoKey.ahk"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist\AutoKey.exe"
          & $env:AHK2EXE /in $src /out $out /base $env:AHK_BASE /compress 2 /silent verbose
          if (-not (Test-Path $out)) {
            & $env:AHK2EXE /in $src /out $out /base $env:AHK_BASE /compress 0 /silent verbose
          }
          if (-not (Test-Path $out)) { throw "compile failed" }
          Copy-Item -Path "configs\*" -Destination "dist\configs\" -Force
          Get-Item $out | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoKey-windows
          path: dist/
          if-no-files-found: error
