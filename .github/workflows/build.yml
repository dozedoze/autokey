name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          $setup = "$env:TEMP\ahk-v2-setup.exe"
          $urls = @(
            "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19_setup.exe",
            "https://www.autohotkey.com/download/ahk-v2.exe"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing
              $ok = $true
              break
            } catch {
              Write-Warning $_
            }
          }
          if (-not $ok) { throw "failed to download AutoHotkey installer" }
          Start-Process -FilePath $setup -ArgumentList "/silent" -Wait
          $candidates = @(
            "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe",
            "$env:LocalAppData\Programs\AutoHotkey\v2\AutoHotkey64.exe"
          )
          $compilers = @(
            "$env:ProgramFiles\AutoHotkey\Compiler\Ahk2Exe.exe",
            "$env:LocalAppData\Programs\AutoHotkey\Compiler\Ahk2Exe.exe"
          )
          $base = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $comp = $compilers | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $base) {
            $base = Get-ChildItem -Path "$env:ProgramFiles\AutoHotkey","$env:LocalAppData\Programs\AutoHotkey" -Recurse -Filter AutoHotkey64.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $comp) {
            $comp = Get-ChildItem -Path "$env:ProgramFiles\AutoHotkey","$env:LocalAppData\Programs\AutoHotkey" -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $base) { throw "AutoHotkey64.exe not found after install" }
          if (-not $comp) { throw "Ahk2Exe.exe not found after install" }
          "AHK_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AHK2EXE=$comp" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Base=$base"
          Write-Host "Compiler=$comp"

      - name: Compile AutoKey.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\configs | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "src\AutoKey.ahk"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist\AutoKey.exe"
          & $env:AHK2EXE /in $src /out $out /base $env:AHK_BASE /compress 2
          if (-not (Test-Path $out)) {
            & $env:AHK2EXE /in $src /out $out /base $env:AHK_BASE /compress 0
          }
          if (-not (Test-Path $out)) { throw "compile failed" }
          Copy-Item -Path "configs\*" -Destination "dist\configs\" -Force
          Get-Item $out | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoKey-windows
          path: dist/
          if-no-files-found: error
