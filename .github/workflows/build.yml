name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # AutoHotkey v2 的安装包不含 Ahk2Exe，编译器必须从自己的仓库单独取。
      - name: Fetch AutoHotkey v2 + Ahk2Exe (portable)
        shell: pwsh
        env:
          AHK_VERSION: 2.0.19
          AHK2EXE_TAG: Ahk2Exe1.1.37.02a2
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $tools = Join-Path $env:GITHUB_WORKSPACE "tools\ahk"
          New-Item -ItemType Directory -Force -Path "$tools\Compiler" | Out-Null

          $ahkZip = "$env:TEMP\AutoHotkey_$env:AHK_VERSION.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $ahkZip `
            -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip"
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $tools -Force

          $compZip = "$env:TEMP\$env:AHK2EXE_TAG.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $compZip `
            -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$env:AHK2EXE_TAG/$env:AHK2EXE_TAG.zip"
          Expand-Archive -LiteralPath $compZip -DestinationPath "$tools\Compiler" -Force

          $base = Get-ChildItem -Path $tools -Recurse -Filter AutoHotkey64.exe |
            Select-Object -First 1 -ExpandProperty FullName
          $comp = Get-ChildItem -Path $tools -Recurse -Filter Ahk2Exe.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $base) { throw "AutoHotkey64.exe not found in $tools" }
          if (-not $comp) { throw "Ahk2Exe.exe not found in $tools" }
          # utf8：避免 Out-File 默认编码把 GITHUB_ENV 写坏
          Add-Content -Path $env:GITHUB_ENV -Value "AHK_BASE=$base" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "AHK2EXE=$comp" -Encoding utf8
          Write-Host "Base=$base"
          Write-Host "Compiler=$comp"

      - name: Validate script syntax
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "src\AutoKey.ahk"
          if (-not $env:AHK_BASE -or -not (Test-Path -LiteralPath $env:AHK_BASE)) {
            throw "AHK_BASE missing: '$env:AHK_BASE'"
          }
          $log = Join-Path $env:TEMP "ahk-validate.log"
          if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }

          # AutoHotkey64 是 GUI 子系统：直接 & 调用时 $LASTEXITCODE 常为 $null，
          # 而 ($null -ne 0) 为真，会误报 "syntax check failed (exit )"。
          # 经 cmd 重定向可拿到真实退出码，并把 /ErrorStdOut 的报错打进日志。
          $ahk = $env:AHK_BASE
          cmd.exe /c "`"$ahk`" /ErrorStdOut=UTF-8 /validate `"$src`" >`"$log`" 2>&1"
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $log) {
            $text = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            if ($text) { Write-Host $text }
          }
          if ($code -ne 0) {
            throw "syntax check failed (exit $code)"
          }
          Write-Host "syntax OK"

      - name: Compile AutoKey.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\configs | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "src\AutoKey.ahk"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist\AutoKey.exe"
          $log = Join-Path $env:TEMP "ahk2exe.log"
          if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }

          $ahk2exe = $env:AHK2EXE
          $base = $env:AHK_BASE
          cmd.exe /c "`"$ahk2exe`" /in `"$src`" /out `"$out`" /base `"$base`" /compress 2 /silent verbose >`"$log`" 2>&1"
          if (-not (Test-Path -LiteralPath $out)) {
            cmd.exe /c "`"$ahk2exe`" /in `"$src`" /out `"$out`" /base `"$base`" /compress 0 /silent verbose >>`"$log`" 2>&1"
          }
          if (Test-Path -LiteralPath $log) {
            $text = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            if ($text) { Write-Host $text }
          }
          if (-not (Test-Path -LiteralPath $out)) { throw "compile failed (see Ahk2Exe log above)" }
          Copy-Item -Path "configs\*" -Destination "dist\configs\" -Force
          Get-Item $out | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoKey-windows
          path: dist/
          if-no-files-found: error
